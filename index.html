<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoTube - Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container grid grid-2">
    <div class="card">
      <h2>Login</h2>
      <form id="loginForm">
        <label>Email<input class="input" name="email" type="email" required /></label>
        <label>Password<input class="input" name="password" type="password" required /></label>
        <button class="btn btn-primary" type="submit">Login</button>
      </form>
    </div>
    <div class="card">
      <h2>Signup</h2>
      <form id="signupForm">
        <label>Name<input class="input" name="name" required /></label>
        <label>Email<input class="input" name="email" type="email" required /></label>
        <label>Password<input class="input" name="password" type="password" required /></label>
        <button class="btn btn-primary" type="submit">Signup</button>
      </form>
      <hr />
      <button id="ytConnectBtn" class="btn btn-secondary" type="button">Connect YouTube OAuth2</button>
      <div id="authMsg"></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
