<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AutoTube AI</title>

  <link
    rel="stylesheet"
    href="./style.css"
  />

</head>
<body>

  <!-- LOADER -->

  <div
    id="loader"
    class="loader hidden"
  >
    Loading...
  </div>

  <!-- AUTH -->

  <div
    class="auth-screen"
    id="authScreen"
  >

    <div class="auth-card">

      <h1>
        AutoTube AI 🚀
      </h1>

      <p>
        AI Shorts Automation SaaS
      </p>

      <input
        type="text"
        id="name"
        placeholder="Name"
      />

      <input
        type="email"
        id="email"
        placeholder="Email"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
      />

      <button onclick="signup()">
        Signup
      </button>

      <button onclick="login()">
        Login
      </button>

    </div>

  </div>

  <!-- APP -->

  <div
    class="app hidden"
    id="app"
  >

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div>

        <div class="logo">
          AutoTube
        </div>

        <button onclick="loadDashboard()">
          Dashboard
        </button>

        <button onclick="connectYouTube()">
          Connect Channel
        </button>

        <button onclick="openModal()">
          Create Project
        </button>

      </div>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        Logout
      </button>

    </aside>

    <!-- MAIN -->

    <main class="main">

      <div class="topbar">

        <div>

          <h1>
            Dashboard 🚀
          </h1>

          <p>
            AI Shorts SaaS Platform
          </p>

        </div>

      </div>

      <!-- CHANNELS -->

      <section>

        <div class="section-title">
          Channels
        </div>

        <div
          class="grid"
          id="channelsGrid"
        ></div>

      </section>

      <!-- PROJECTS -->

      <section>

        <div class="section-title">
          Projects
        </div>

        <div
          class="grid"
          id="projectsGrid"
        ></div>

      </section>

    </main>

  </div>

  <!-- MODAL -->

  <div
    class="modal hidden"
    id="projectModal"
  >

    <div class="modal-card">

      <h2>
        Create Project
      </h2>

      <input
        type="text"
        id="projectName"
        placeholder="Project Name"
      />

      <select id="projectNiche">

        <option value="islamic">
          Islamic
        </option>

        <option value="motivation">
          Motivation
        </option>

        <option value="quiz">
          Quiz
        </option>

        <option value="facts">
          Facts
        </option>

      </select>

      <select id="projectTheme">

        <option value="golden">
          Golden
        </option>

        <option value="dark">
          Dark
        </option>

        <option value="neon">
          Neon
        </option>

        <option value="minimal">
          Minimal
        </option>

      </select>

      <input
        type="text"
        id="projectTopics"
        placeholder="sabar,quran,discipline"
      />

      <select id="projectPrivacy">

        <option value="public">
          Public
        </option>

        <option value="private">
          Private
        </option>

        <option value="unlisted">
          Unlisted
        </option>

      </select>

      <select id="projectChannel"></select>

      <div class="modal-actions">

        <button onclick="createProject()">
          Create
        </button>

        <button
          class="danger"
          onclick="closeModal()"
        >
          Close
        </button>

      </div>

    </div>

  </div>

  <script src="./script.js"></script>

</body>
</html>
