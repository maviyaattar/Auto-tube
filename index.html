
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AutoTube AI</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    :root{
      --bg:#050816;
      --card:#111827;
      --border:#ffffff15;
      --text:#ffffff;
      --muted:#94a3b8;
      --purple:#7c3aed;
      --cyan:#06b6d4;
    }

    body{
      background:
      radial-gradient(circle at top left,#7c3aed22,transparent 25%),
      radial-gradient(circle at bottom right,#06b6d422,transparent 25%),
      var(--bg);

      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
    }

    /* ===================== */
    /* PARTICLES */
    /* ===================== */

    .particles{
      position:fixed;
      inset:0;
      overflow:hidden;
      z-index:-1;
    }

    .particles span{
      position:absolute;
      width:3px;
      height:3px;
      background:#ffffff55;
      border-radius:50%;
      animation:float linear infinite;
    }

    @keyframes float{

      from{
        transform:translateY(100vh);
      }

      to{
        transform:translateY(-10vh);
      }
    }

    /* ===================== */
    /* APP */
    /* ===================== */

    .app{
      display:flex;
      min-height:100vh;
    }

    /* ===================== */
    /* SIDEBAR */
    /* ===================== */

    .sidebar{
      width:270px;
      background:#0b1220;
      border-right:1px solid var(--border);
      padding:30px 20px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      font-size:34px;
      font-weight:bold;
      margin-bottom:40px;

      background:
      linear-gradient(
        to right,
        var(--purple),
        var(--cyan)
      );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .menu button{
      background:#ffffff08;
      border:none;
      color:white;
      padding:16px;
      border-radius:18px;
      cursor:pointer;
      text-align:left;
      transition:0.3s;
      font-size:15px;
    }

    .menu button:hover,
    .menu .active{

      background:
      linear-gradient(
        to right,
        var(--purple),
        var(--cyan)
      );

      transform:translateX(5px);
    }

    .logout{
      background:#ff004c22;
      border:none;
      color:#ff7b9d;
      padding:16px;
      border-radius:18px;
      cursor:pointer;
    }

    /* ===================== */
    /* MAIN */
    /* ===================== */

    .main{
      flex:1;
      padding:35px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:20px;
      margin-bottom:35px;
    }

    .topbar h1{
      font-size:40px;
      margin-bottom:10px;
    }

    .topbar p{
      color:var(--muted);
    }

    .connect-btn{
      border:none;
      color:white;
      cursor:pointer;
      padding:16px 28px;
      border-radius:18px;
      font-weight:bold;

      background:
      linear-gradient(
        to right,
        var(--purple),
        var(--cyan)
      );
    }

    /* ===================== */
    /* STATS */
    /* ===================== */

    .stats{
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(220px,1fr));

      gap:20px;
      margin-bottom:40px;
    }

    .stat-card{
      background:#ffffff08;
      border:1px solid var(--border);
      padding:25px;
      border-radius:24px;
    }

    .stat-card h2{
      font-size:42px;
      margin-bottom:10px;
    }

    .stat-card p{
      color:var(--muted);
    }

    /* ===================== */
    /* ACCOUNTS */
    /* ===================== */

    .accounts{
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(320px,1fr));

      gap:25px;
    }

    .account{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:25px;
      padding:25px;
    }

    .profile{
      display:flex;
      align-items:center;
      gap:15px;
      margin-bottom:20px;
    }

    .profile img{
      width:70px;
      height:70px;
      border-radius:50%;
      border:3px solid var(--cyan);
    }

    .profile p{
      color:var(--muted);
      font-size:14px;
      margin-top:5px;
    }

    .badge{
      display:inline-block;
      background:#00ff8822;
      color:#00ff88;
      padding:8px 14px;
      border-radius:50px;
      margin-bottom:20px;
      font-size:13px;
    }

    .actions{
      display:flex;
      gap:12px;
    }

    .switch-btn,
    .disconnect-btn{

      flex:1;
      border:none;
      padding:14px;
      border-radius:15px;
      cursor:pointer;
      font-weight:bold;
    }

    .switch-btn{

      background:
      linear-gradient(
        to right,
        var(--purple),
        var(--cyan)
      );

      color:white;
    }

    .disconnect-btn{
      background:#ff004c22;
      color:#ff7b9d;
    }

    /* ===================== */
    /* AUTH */
    /* ===================== */

    .auth-screen{
      position:fixed;
      inset:0;
      background:#020617;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:999;
      padding:20px;
    }

    .auth-box{
      width:100%;
      max-width:420px;

      background:#0f172acc;
      border:1px solid var(--border);

      padding:40px;
      border-radius:30px;
      backdrop-filter:blur(20px);
    }

    .auth-box h1{
      text-align:center;
      font-size:40px;
      margin-bottom:10px;
    }

    .auth-box p{
      text-align:center;
      color:var(--muted);
      margin-bottom:30px;
    }

    .input-box{
      margin-bottom:18px;
    }

    .input-box input{
      width:100%;
      padding:16px;
      border:none;
      outline:none;
      background:#ffffff08;
      border-radius:16px;
      color:white;
    }

    .auth-btn{
      width:100%;
      border:none;
      cursor:pointer;
      padding:16px;
      border-radius:16px;
      color:white;
      font-size:16px;
      font-weight:bold;

      background:
      linear-gradient(
        to right,
        var(--purple),
        var(--cyan)
      );
    }

    .toggle{
      text-align:center;
      margin-top:20px;
      color:var(--muted);
    }

    .toggle span{
      color:var(--cyan);
      cursor:pointer;
    }

    /* ===================== */
    /* LOADER */
    /* ===================== */

    .loader-screen{
      position:fixed;
      inset:0;
      background:#00000088;
      display:none;
      justify-content:center;
      align-items:center;
      z-index:99999;
    }

    .loader{
      width:70px;
      height:70px;
      border-radius:50%;
      border:6px solid transparent;
      border-top:6px solid var(--cyan);
      border-right:6px solid var(--purple);
      animation:spin 1s linear infinite;
    }

    @keyframes spin{

      100%{
        transform:rotate(360deg);
      }
    }

    /* ===================== */
    /* TOAST */
    /* ===================== */

    #toastBox{
      position:fixed;
      top:20px;
      right:20px;
      display:flex;
      flex-direction:column;
      gap:15px;
      z-index:999999;
    }

    .toast{
      min-width:260px;
      padding:16px;
      border-radius:18px;
      color:white;
      font-weight:bold;
      animation:slide 0.4s ease;
    }

    .success{
      background:#00ff8840;
      border:1px solid #00ff88;
    }

    .error{
      background:#ff004c40;
      border:1px solid #ff4d79;
    }

    .warning{
      background:#ffaa0040;
      border:1px solid #ffaa00;
    }

    @keyframes slide{

      from{
        opacity:0;
        transform:translateX(100%);
      }

      to{
        opacity:1;
        transform:translateX(0);
      }
    }

    @media(max-width:900px){

      .app{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
      }
    }

  </style>

</head>

<body>

  <!-- PARTICLES -->
  <div
    class="particles"
    id="particles"
  ></div>

  <!-- LOADER -->
  <div
    class="loader-screen"
    id="loader"
  >
    <div class="loader"></div>
  </div>

  <!-- TOAST -->
  <div id="toastBox"></div>

  <!-- AUTH -->
  <div
    class="auth-screen"
    id="authScreen"
  >

    <div class="auth-box">

      <h1 id="authTitle">
        AutoTube AI
      </h1>

      <p>
        YouTube Automation Dashboard
      </p>

      <div id="nameField">

        <div class="input-box">

          <input
            type="text"
            id="name"
            placeholder="Full Name"
          />

        </div>

      </div>

      <div class="input-box">

        <input
          type="email"
          id="email"
          placeholder="Email"
        />

      </div>

      <div class="input-box">

        <input
          type="password"
          id="password"
          placeholder="Password"
        />

      </div>

      <button
        class="auth-btn"
        id="authBtn"
      >
        Create Account
      </button>

      <div
        class="toggle"
        id="toggleText"
      >

        Already have account?

        <span onclick="toggleAuth()">
          Login
        </span>

      </div>

    </div>

  </div>

  <!-- APP -->
  <div class="app">

    <!-- SIDEBAR -->
    <div class="sidebar">

      <div>

        <div class="logo">
          AutoTube
        </div>

        <div class="menu">

          <button class="active">
            <i class="fa-solid fa-house"></i>
            Dashboard
          </button>

          <button>
            <i class="fa-brands fa-youtube"></i>
            Channels
          </button>

          <button>
            <i class="fa-solid fa-gear"></i>
            Settings
          </button>

        </div>

      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

    <!-- MAIN -->
    <div class="main">

      <div class="topbar">

        <div>

          <h1>
            Welcome Back 👋
          </h1>

          <p>
            Manage your YouTube channels
          </p>

        </div>

        <button
          class="connect-btn"
          onclick="connectYouTube()"
        >
          Connect YouTube
        </button>

      </div>

      <!-- STATS -->
      <div class="stats">

        <div class="stat-card">

          <h2 id="channelCount">
            0
          </h2>

          <p>
            Connected Channels
          </p>

        </div>

        <div class="stat-card">

          <h2>
            AI
          </h2>

          <p>
            Automation Ready
          </p>

        </div>

        <div class="stat-card">

          <h2>
            100%
          </h2>

          <p>
            OAuth Ready
          </p>

        </div>

      </div>

      <!-- ACCOUNTS -->
      <h2
        style="
        margin-bottom:25px;
        font-size:30px;
        "
      >
        Connected Accounts
      </h2>

      <div
        class="accounts"
        id="accounts"
      ></div>

    </div>

  </div>

  <script>

    // =====================
    // CONFIG
    // =====================

    const API =
    'https://autotube-kajc.onrender.com/api'

    let isLogin = false

    // =====================
    // PARTICLES
    // =====================

    const particles =
    document.getElementById(
      'particles'
    )

    for(let i=0;i<80;i++){

      const span =
      document.createElement('span')

      span.style.left =
      Math.random() * 100 + '%'

      span.style.animationDuration =
      (5 + Math.random() * 10)
      + 's'

      span.style.opacity =
      Math.random()

      particles.appendChild(span)
    }

    // =====================
    // TOAST
    // =====================

    function showToast(
      message,
      type='success'
    ){

      const toast =
      document.createElement('div')

      toast.className =
      `toast ${type}`

      toast.innerText = message

      document
      .getElementById('toastBox')
      .appendChild(toast)

      setTimeout(()=>{

        toast.remove()

      },3000)
    }

    // =====================
    // LOADER
    // =====================

    function showLoader(){

      document
      .getElementById('loader')
      .style.display='flex'
    }

    function hideLoader(){

      document
      .getElementById('loader')
      .style.display='none'
    }

    // =====================
    // SAFE FETCH
    // =====================

    async function safeFetch(
      url,
      options={}
    ){

      try{

        const controller =
        new AbortController()

        const timeout =
        setTimeout(()=>{

          controller.abort()

        },60000)

        const res =
        await fetch(url,{
          ...options,
          signal:controller.signal
        })

        clearTimeout(timeout)

        const data =
        await res.json()

        if(!res.ok){

          throw new Error(
            data.msg ||
            'Request failed'
          )
        }

        return data

      }catch(err){

        if(
          err.name === 'AbortError'
        ){

          showToast(
            'Server timeout',
            'error'
          )

        }else{

          showToast(
            err.message,
            'error'
          )
        }

        throw err
      }
    }

    // =====================
    // TOGGLE AUTH
    // =====================

    function toggleAuth(){

      isLogin = !isLogin

      const title =
      document.getElementById(
        'authTitle'
      )

      const btn =
      document.getElementById(
        'authBtn'
      )

      const toggle =
      document.getElementById(
        'toggleText'
      )

      const nameField =
      document.getElementById(
        'nameField'
      )

      if(isLogin){

        title.innerText =
        'Welcome Back'

        btn.innerText =
        'Login'

        nameField.style.display =
        'none'

        toggle.innerHTML =
        `
        Don't have account?
        <span onclick="toggleAuth()">
        Signup
        </span>
        `

      }else{

        title.innerText =
        'AutoTube AI'

        btn.innerText =
        'Create Account'

        nameField.style.display =
        'block'

        toggle.innerHTML =
        `
        Already have account?
        <span onclick="toggleAuth()">
        Login
        </span>
        `
      }
    }

    // =====================
    // AUTH
    // =====================

    document
    .getElementById('authBtn')
    .addEventListener(
      'click',
      authUser
    )

    async function authUser(){

      try{

        showLoader()

        const name =
        document
        .getElementById('name')
        .value.trim()

        const email =
        document
        .getElementById('email')
        .value.trim()

        const password =
        document
        .getElementById('password')
        .value.trim()

        if(!email || !password){

          hideLoader()

          showToast(
            'Fill all fields',
            'warning'
          )

          return
        }

        if(
          !isLogin &&
          !name
        ){

          hideLoader()

          showToast(
            'Enter your name',
            'warning'
          )

          return
        }

        const endpoint =
        isLogin
        ? 'login'
        : 'signup'

        const body =
        isLogin
        ? { email,password }
        : { name,email,password }

        const data =
        await safeFetch(
          `${API}/${endpoint}`,
          {
            method:'POST',

            headers:{
              'Content-Type':
              'application/json'
            },

            body:
            JSON.stringify(body)
          }
        )

        localStorage.setItem(
          'token',
          data.token
        )

        document
        .getElementById(
          'authScreen'
        )
        .style.display='none'

        showToast(
          isLogin
          ? 'Login successful'
          : 'Account created'
        )

        loadUser()

      }catch(err){

        console.log(err)

      }finally{

        hideLoader()
      }
    }

    // =====================
    // LOAD USER
    // =====================

    async function loadUser(){

      try{

        const token =
        localStorage.getItem(
          'token'
        )

        if(!token) return

        document
        .getElementById(
          'authScreen'
        )
        .style.display='none'

        showLoader()

        const data =
        await safeFetch(
          `${API}/me`,
          {
            headers:{
              Authorization:
              `Bearer ${token}`
            }
          }
        )

        renderAccounts(
          data.user.ytAccounts,
          data.user.selectedAccount
        )

      }catch(err){

        console.log(err)

      }finally{

        hideLoader()
      }
    }

    // =====================
    // RENDER ACCOUNTS
    // =====================

    function renderAccounts(
      accounts,
      selected
    ){

      const container =
      document.getElementById(
        'accounts'
      )

      document
      .getElementById(
        'channelCount'
      )
      .innerText =
      accounts.length

      if(accounts.length === 0){

        container.innerHTML =
        `
        <div class="stat-card">

          <h2>
            No Channels
          </h2>

          <p>
            Connect your first
            YouTube account 🚀
          </p>

        </div>
        `

        return
      }

      container.innerHTML=''

      accounts.forEach(
        (acc,index)=>{

          container.innerHTML +=
          `
          <div class="account">

            <div class="profile">

              <img
                src="${acc.profileImg}"
              />

              <div>

                <h3>
                  ${acc.channelTitle}
                </h3>

                <p>
                  ${acc.email}
                </p>

              </div>

            </div>

            ${
              selected === index
              ?
              `
              <div class="badge">
                ACTIVE CHANNEL
              </div>
              `
              :
              ''
            }

            <div class="actions">

              <button
                class="switch-btn"
                onclick="switchAccount(${index})"
              >
                Switch
              </button>

              <button
                class="disconnect-btn"
                onclick="disconnectAccount(${index})"
              >
                Disconnect
              </button>

            </div>

          </div>
          `
        }
      )
    }

    // =====================
    // CONNECT YOUTUBE
    // =====================

    async function connectYouTube(){

      try{

        showLoader()

        const token =
        localStorage.getItem(
          'token'
        )

        if(!token){

          hideLoader()

          showToast(
            'Please login first',
            'warning'
          )

          return
        }

        const data =
        await safeFetch(
          `${API}/youtube/connect`,
          {
            headers:{
              Authorization:
              `Bearer ${token}`
            }
          }
        )

        hideLoader()

        window.location.href =
        data.url

      }catch(err){

        console.log(err)

        hideLoader()
      }
    }

    // =====================
    // HANDLE CALLBACK
    // =====================

    async function handleOAuthCallback(){

      try{

        const path =
        window.location.pathname

        if(
          !path.includes(
            '/oauth/google-callback'
          )
        ){
          return
        }

        showLoader()

        const params =
        new URLSearchParams(
          window.location.search
        )

        const code =
        params.get('code')

        if(!code){

          hideLoader()

          showToast(
            'OAuth code missing',
            'error'
          )

          return
        }

        const token =
        localStorage.getItem(
          'token'
        )

        if(!token){

          hideLoader()

          showToast(
            'Please login first',
            'warning'
          )

          return
        }

        const data =
        await safeFetch(
          `${API}/youtube/callback`,
          {
            method:'POST',

            headers:{
              'Content-Type':
              'application/json',

              Authorization:
              `Bearer ${token}`
            },

            body:
            JSON.stringify({
              code
            })
          }
        )

        renderAccounts(
          data.ytAccounts,
          data.selectedAccount
        )

        window.history.replaceState(
          {},
          document.title,
          '/'
        )

        showToast(
          'YouTube Connected Successfully'
        )

      }catch(err){

        console.log(err)

      }finally{

        hideLoader()
      }
    }

    // =====================
    // SWITCH ACCOUNT
    // =====================

    async function switchAccount(
      idx
    ){

      try{

        showLoader()

        const token =
        localStorage.getItem(
          'token'
        )

        await safeFetch(
          `${API}/youtube/switch`,
          {
            method:'POST',

            headers:{
              'Content-Type':
              'application/json',

              Authorization:
              `Bearer ${token}`
            },

            body:
            JSON.stringify({
              idx
            })
          }
        )

        showToast(
          'Account switched'
        )

        loadUser()

      }catch(err){

        console.log(err)

      }finally{

        hideLoader()
      }
    }

    // =====================
    // DISCONNECT
    // =====================

    async function disconnectAccount(
      idx
    ){

      try{

        const ok =
        confirm(
          'Disconnect account?'
        )

        if(!ok) return

        showLoader()

        const token =
        localStorage.getItem(
          'token'
        )

        const data =
        await safeFetch(
          `${API}/youtube/disconnect`,
          {
            method:'POST',

            headers:{
              'Content-Type':
              'application/json',

              Authorization:
              `Bearer ${token}`
            },

            body:
            JSON.stringify({
              idx
            })
          }
        )

        renderAccounts(
          data.ytAccounts,
          data.selectedAccount
        )

        showToast(
          'Account disconnected'
        )

      }catch(err){

        console.log(err)

      }finally{

        hideLoader()
      }
    }

    // =====================
    // LOGOUT
    // =====================

    function logout(){

      localStorage.removeItem(
        'token'
      )

      document
      .getElementById(
        'authScreen'
      )
      .style.display='flex'

      showToast(
        'Logged out',
        'warning'
      )
    }

    // =====================
    // START
    // =====================

    loadUser()
    handleOAuthCallback()

  </script>

</body>
</html>
