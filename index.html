<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AutoTube SaaS Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <style>
    :root {
      --brand: #163352;
      --accent: #efa621;
      --bg: #f5f5f9;
      --card: #fff;
      --shadow: 0 2px 10px rgba(22,51,82,0.09);
      --radius: 16px;
      --header-font: "Poppins", Arial, sans-serif;
    }
    body {
      margin: 0; padding: 0;
      background: var(--bg);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #21222c;
      min-height: 100vh;
    }
    .container {
      max-width: 470px;
      margin: 0 auto;
      padding: 20px 8px 40px;
      min-height: 100vh;
    }
    .card {
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      margin-bottom: 22px;
      padding: 22px;
    }
    .card h2 {
      font-family: var(--header-font);
      margin-top: 0;
      color: var(--brand);
      font-size: 1.25rem;
    }
    .btn {
      background: var(--brand);
      color: #fff !important;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 8px;
      margin-bottom: 8px;
      padding: 13px 24px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(22,51,82,0.07);
      transition: background .13s;
      outline: none;
    }
    .btn:active { background: #0d2237; }
    .btn-secondary {
      background: var(--accent);
      color: #232 !important;
    }
    .btn-danger {
      background: #e74b47;
      color: #fff !important;
    }
    .input-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      margin-bottom: 5px;
      font-size: .98rem;
      font-weight: 600;
    }
    .input-group input, .input-group select {
      padding: 9px 12px;
      border: 1px solid #d5d6df;
      border-radius: 6px;
      font-size: 1rem;
      background: #fafbfc;
    }
    .switch-link {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline !important;
      margin-top: 8px;
      font-size: 1rem;
      display: block;
    }
    .dashboard { }
    .short-card {
      padding: 12px 9px 8px 9px;
      border-radius: 10px;
      background: #fafdfe;
      box-shadow: 0 1px 4px #bdd5e821;
      margin-bottom: 11px;
      font-size: .98rem;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }
    .short-card strong { color: var(--brand);}
    .short-card .date {
      font-size: .88em;
      color: #54688d;
      font-style: italic;
      margin-top: 7px;
      display: block;
    }
    .short-thumb {
      width: 52px; height: 90px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--brand);
      background: #eee;
      flex-shrink: 0;
    }
    .short-card .job-error {
      color: #b51c1c;
      font-size: .92em;
      background: #faeaeb;
      padding: 4px 7px;
      border-radius: 6px;
      margin-top: 6px;
    }
    @media (max-width: 510px) {
      .container { padding: 4vw 1vw 14vw; }
      .card { padding: 4vw 3vw; }
      .short-thumb { width: 22vw; height: 37vw; }
    }
    .logout-btn {
      background: #eee;
      color: #d92020 !important;
      font-size: .97em;
      padding: 6px 15px;
      border-radius: 7px;
      font-weight: 600;
      border: none;
      margin-left: auto;
      margin-top: -15px;
      margin-bottom: 0;
      box-shadow:none;
    }
    .yt-chip {
      display: inline-block;
      border-radius: 13px;
      font-size: .97em;
      background: #e6ecec;
      padding: 4px 10px 4px 5px;
      margin: 3px 7px 3px 0;
      color: #ed1818;
      font-weight: bold;
      border: 1.7px solid #ed1818;
      box-shadow: 0 1px 3px #ed181844;
      vertical-align: middle;
      cursor: pointer;
      transition: background 0.15s;
    }
    .yt-chip.selected {
      background: #ff464a !important;
      color: #fff;
      border-color: #ba0d15;
    }
    .yt-chip img {
      width: 18px; height: 18px; border-radius: 100px; vertical-align: middle; margin-right:5px;
    }
    .yt-chip .disconnect {
      background: #ffbaba;
      color: #333;
      border: none;
      border-radius: 8px;
      margin-left: 5px;
      padding: 0 7px;
      font-size: .92em;
      cursor:pointer;
      font-weight: 400;
      outline: none;
    }
    .status {
      font-size: .98em;
      margin: 5px 0 11px 0;
      color: #26a747;
      font-weight: 600;
    }
    .error {
      color: #b51c1c;
      padding: 7px 0;
      font-weight: 600;
      background: #faeaeb;
      border-radius: 7px;
      text-align: center;
    }
    .success {
      color: #267a16;
      background: #e9fadf;
      border-radius: 7px;
      padding: 7px 0;
      text-align: center;
      font-weight: 600;
    }
    .center { text-align:center; }
    .topbar {
      background: var(--brand);
      margin: -20px -8px 25px -8px;
      padding: 16px 16px 28px 14px;
      border-radius: 0 0 var(--radius) var(--radius);
      color: #fff;
      font-family: var(--header-font);
      font-size: 1.17em;
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.01em;
      position: sticky;
      top: 0; z-index: 4;
      box-shadow: 0 1px 6px #2225a209;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-circle {
      width: 39px; height: 39px; line-height: 41px;
      background: #efa621;
      color: #fff;
      border-radius: 50%;
      display: inline-block;
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      border: 2.5px solid #fff8;
      box-shadow: 0 1px 9px #f6b90f3a;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo-circle">⏫</div> AutoTube SaaS
    <button class="logout-btn" id="logoutBtn" style="display:none;">Log Out</button>
  </div>
  <div class="container" id="app"></div>
  <script>
    const API_BASE = 'https://autotube-kajc.onrender.com';
    let token = localStorage.getItem('token') || '';
    let user = null, themes = [], niches = [], ytConnected = false, ytLoading = false;

    function setStatus(msg, isErr=false) {
      const stat = document.getElementById('status');
      if (stat) stat.innerHTML = msg
        ? (isErr ? `<div class="error">${msg}</div>` : `<div class="success">${msg}</div>`)
        : '';
    }
    function show(view) { document.getElementById('app').innerHTML = view; }

    async function api(method, path, body = null, auth = true) {
      setStatus("", false);
      let opt = { method, headers: { 'Content-Type': 'application/json' } };
      if (auth && token) opt.headers['Authorization'] = 'Bearer ' + token;
      if (body) opt.body = JSON.stringify(body);
      let resp = await fetch(API_BASE + path, opt);
      let data = {};
      try { data = await resp.json(); } catch{}
      if (resp.status >= 400) throw new Error(data.msg || 'Error');
      return data;
    }

    function loginView() {
      show(`<div class="card center">
        <h2>Sign In</h2>
        <div id="status"></div>
        <form id="loginForm">
          <div class="input-group"><label>Email</label><input type="email" name="email" required></div>
          <div class="input-group"><label>Password</label><input type="password" name="password" required></div>
          <button class="btn" type="submit">Login</button>
        </form>
        <a class="switch-link" id="goSignup">No account? Sign Up</a>
      </div>`);
      document.getElementById('goSignup').onclick = signupView;
      document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        setStatus("Logging in...");
        try {
          let fd = new FormData(e.target);
          let data = await api('POST','/api/login',{ 
            email: fd.get('email'), password: fd.get('password')
          }, false);
          token = data.token; localStorage.setItem('token', token);
          loadUser();
        } catch(err) { setStatus(err.message, true); }
      }
    }

    function signupView() {
      show(`<div class="card center">
        <h2>Sign Up</h2>
        <div id="status"></div>
        <form id="signupForm">
          <div class="input-group"><label>Name</label><input name="name" required></div>
          <div class="input-group"><label>Email</label><input type="email" name="email" required></div>
          <div class="input-group"><label>Password</label><input type="password" name="password" required></div>
          <button class="btn" type="submit">Create Account</button>
        </form>
        <a class="switch-link" id="goLogin">Back to Login</a>
      </div>`);
      document.getElementById('goLogin').onclick = loginView;
      document.getElementById('signupForm').onsubmit = async (e) => {
        e.preventDefault();
        setStatus("Creating account...");
        try {
          let fd = new FormData(e.target);
          let data = await api('POST','/api/signup',{
            name: fd.get('name'),
            email: fd.get('email'),
            password: fd.get('password')
          }, false);
          token = data.token; localStorage.setItem('token', token);
          loadUser();
        } catch(err) { setStatus(err.message, true); }
      }
    }

    async function prefsView() {
      let pref = user.preferences || {};
      let themeList = themes.map(t => `<option value="${t}" ${pref.theme===t?'selected':''}>${t}</option>`).join('');
      let nicheList = niches.map(n => `<option value="${n}" ${pref.niche===n?'selected':''}>${n}</option>`).join('');
      show(`<div class="card">
        <h2>Preferences</h2>
        <div id="status"></div>
        <form id="prefsForm">
          <div class="input-group">
            <label>Niche</label>
            <select name="niche" required>${nicheList}</select>
          </div>
          <div class="input-group">
            <label>Theme</label>
            <select name="theme" required>${themeList}</select>
          </div>
          <div class="input-group">
            <label>Shorts Per Day</label>
            <input type="number" name="uploadCount" min="1" max="10" value="${pref.uploadCount||1}" required>
          </div>
          <div class="input-group">
            <label>Times to Upload (comma separated, e.g. 09:00,18:00)</label>
            <input name="uploadTimes" value="${(pref.uploadTimes||[]).join(',')}" placeholder="09:00,21:00">
          </div>
          <button class="btn" type="submit">Save Preferences</button>
        </form>
      </div>
      <div class="card center">
        <button class="btn" id="goDashBtn">See My Dashboard</button>
      </div>`);
      document.getElementById('prefsForm').onsubmit = async (e) => {
        e.preventDefault();
        setStatus("Saving...");
        let fd = new FormData(e.target);
        let data = {
          niche: fd.get('niche'),
          theme: fd.get('theme'),
          uploadCount: Number(fd.get('uploadCount') || 1),
          uploadTimes: (fd.get('uploadTimes')||'').split(',').map(s=>s.trim()).filter(Boolean)
        };
        try {
          await api('POST','/api/preferences', data);
          setStatus("Preferences saved!", false);
          await loadUser(true);
        } catch(err) { setStatus(err.message, true); }
      };
      document.getElementById('goDashBtn').onclick = dashboardView;
    }

    function ytAccountsView() {
      let html = '';
      let curr = user.selectedAccount || 0;
      if (!user.ytAccounts || !user.ytAccounts.length) {
        html = `<div style="margin-bottom:10px">No YouTube Channel Connected.</div>
        <button class="btn" id="ytConnectBtn">${ytLoading ? "Connecting..." : "Connect YouTube"}</button>`;
      } else {
        html = user.ytAccounts.map((acc, i)=>`
          <div class="yt-chip ${i==curr?'selected':''}" data-idx="${i}">
            <img src="${acc.profileImg||''}" alt="">${acc.channelTitle}
            <button class="disconnect" data-idx="${i}">X</button>
            ${i==curr ? " (Active)" : ""}
          </div>
        `).join('') + `<button class="btn" id="ytConnectBtn" style="margin-left:1em">${ytLoading?"Connecting...":"Add More"}</button>`;
      }
      show(`<div class="card">
        <h2>YouTube Channels</h2>
        <div id="status"></div>
        ${html}
        <div style="margin-top:15px;margin-bottom:7px"><button class="btn" id="backBtn">Back</button></div>
      </div>`);
      // Switch or disconnect
      document.querySelectorAll('.yt-chip').forEach(el=>{
        el.onclick = ()=> {
          let i = Number(el.dataset.idx);
          if(i!==curr) switchYTAccount(i);
        }
        el.querySelector('.disconnect').onclick = (ev)=>{
          ev.stopPropagation();
          let i=Number(ev.target.dataset.idx);
          if(confirm('Disconnect this YouTube channel?')) disconnectYTAccount(i);
        }
      });
      document.getElementById('ytConnectBtn').onclick = connectYouTube;
      document.getElementById('backBtn').onclick = dashboardView;
    }

    async function switchYTAccount(idx) {
      try {
        await api('POST','/api/youtube/switch',{ idx });
        setStatus('Switched!',false); await loadUser(true); ytAccountsView();
      } catch(e) { setStatus(e.message,true); }
    }
    async function disconnectYTAccount(idx) {
      try {
        await api('POST','/api/youtube/disconnect',{ idx });
        setStatus('Disconnected!',false); await loadUser(true); ytAccountsView();
      } catch(e) { setStatus(e.message,true); }
    }

    async function connectYouTube() {
      ytLoading = true; ytAccountsView();
      try {
        let d = await api('GET','/api/youtube/connect');
        window.location = d.url; // Google OAuth page (redirect)
      } catch(e) { ytLoading=false; setStatus(e.message,true); }
    }
    // Called on /oauth/google-callback page, GET param ?code=___
    async function handleYTCodeConnect() {
      const code = new URLSearchParams(window.location.search).get('code');
      if(!code) return dashboardView();
      show(`<div class="card center"><h2>Connecting YouTube...</h2><div id="status"></div></div>`);
      try {
        await api('POST','/api/youtube/callback', { code });
        setStatus('YouTube channel connected!',false);
        window.history.replaceState({},document.title,"/"); // Cleanup URL
        await loadUser();
      } catch(err) {
        setStatus('YouTube Connect Failed: '+err.message,true);
        setTimeout(dashboardView, 3000);
      }
    }

    function dashboardView() {
      let currYt = user.ytAccounts && user.ytAccounts[user.selectedAccount||0];
      show(`<div class="card center">
        <h2>Dashboard</h2>
        <div id="status"></div>
        <div>
          <button class="btn" id="goPrefsBtn" style="margin-bottom:7px;">Update Preferences</button>
          <button class="btn" id="ytAcctBtn" style="margin-bottom:7px;background:var(--accent);color:#212;">YouTube Accounts</button>
          <button class="btn" id="newShortBtn" style="margin-bottom:7px;background:#4DB34D;">Schedule New Short</button>
        </div>
        <div style="margin:10px 0;">
          ${currYt ? `<span style="font-size:1.04em">Connected channel: <b>${currYt.channelTitle}</b></span>` : `<span style="color:#e74b47">YouTube channel NOT linked!</span>`}
        </div>
      </div>
      <div id="shortsCont"></div>
      `);
      document.getElementById('goPrefsBtn').onclick = prefsView;
      document.getElementById('ytAcctBtn').onclick = ytAccountsView;
      document.getElementById('newShortBtn').onclick = async () => {
        setStatus("Scheduling...");
        try {
          await api('POST','/api/schedule');
          setStatus("Short scheduled! You will see it in your list shortly.", false);
          loadShorts();
        } catch(e) {
          setStatus(e.message, true);
        }
      };
      loadShorts();
    }

    async function loadUser(isSilent) {
      try {
        let data = await api('GET', '/api/me');
        user = data.user;
        if (!themes.length || !niches.length) {
          let t = await api('GET', '/api/templates', null, false);
          themes = t.themes; niches = t.niches;
        }
        document.getElementById('logoutBtn').style.display = 'block';
        if (!isSilent) dashboardView();
      } catch(e) {
        token = ''; localStorage.removeItem('token');
        document.getElementById('logoutBtn').style.display = 'none';
        loginView();
      }
    }

    async function loadShorts() {
      try {
        let d = await api('GET','/api/my-shorts');
        let html = '';
        if (!d.shorts || !d.shorts.length)
          html = `<div class="card center">No Shorts yet! Schedule one now.</div>`;
        else html = d.shorts.map(s => `
          <div class="short-card">
            <img class="short-thumb" src="${s.thumbUrl || ''}" alt="">
            <div>
              <strong>${s.topic||''}</strong><br>
              <span>${s.quote||''}</span>
              <span class="date">${s.status === "done" && s.uploadedAt ? 
                `Uploaded ${new Date(s.uploadedAt).toLocaleString()}` :
                s.status === "pending" ? "Pending" : s.status === "failed" ? "Failed" : ""
              }</span>
              ${s.error? `<div class="job-error">${s.error}</div>`:""}
            </div>
          </div>
        `).join('');
        document.getElementById('shortsCont').innerHTML = html;
      } catch(e) {
        document.getElementById('shortsCont').innerHTML = `<div class="error">${e.message}</div>`;
      }
    }

    document.getElementById('logoutBtn').onclick = () => {
      token = ''; localStorage.removeItem('token');
      user = null;
      document.getElementById('logoutBtn').style.display = 'none';
      loginView();
    }

    // ==== Magic: detect OAuth callback ====
    window.onload = () => {
      // If we are at /oauth/google-callback?code=XXX, handle the YouTube connect
      if (window.location.pathname === '/oauth/google-callback') {
        handleYTCodeConnect();
      } else {
        token ? loadUser() : loginView();
      }
      setTimeout(()=>window.scrollTo(0,1), 300);
    };
  </script>
</body>
</html>
